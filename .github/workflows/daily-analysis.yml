name: Daily Operations Analysis

on:
  workflow_dispatch:
  schedule:
    # Rolling intraday analysis, Shanghai 06:15-22:15 every hour.
    - cron: '15 22-23,0-14 * * *'
    # Final daily run at Shanghai 23:00.
    - cron: '0 15 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-analysis.yml'
      - 'src/analyze_daily.py'
      - 'src/analyze_daily_safe.py'
      - 'src/analyze_daily_rule4.py'
      - 'src/reverse_watch_sampler.py'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: daily-operations-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve analysis date
        shell: bash
        run: |
          set -euo pipefail
          target_date="$(TZ=Asia/Shanghai date +%F)"
          echo "TARGET_DATE=${target_date}" >> "$GITHUB_ENV"
          echo "Analyzing Shanghai service date ${target_date} (event=${GITHUB_EVENT_NAME})"

      - name: Build daily exports
        run: python src/analyze_daily_rule4.py --date "$TARGET_DATE"

      - name: Commit daily exports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rm -rf /tmp/daily-export
          mkdir -p /tmp/daily-export
          cp -a data/export/. /tmp/daily-export/

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/export
            cp -a /tmp/daily-export/. data/export/
            git add data/export
            if git diff --cached --quiet; then
              echo 'Daily export already current.'
              exit 0
            fi
            git commit -m "data: publish ${TARGET_DATE} rolling operations analysis"
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'Failed to push daily export after retries.'
              exit 1
            fi
            sleep $((attempt * 2))
          done
