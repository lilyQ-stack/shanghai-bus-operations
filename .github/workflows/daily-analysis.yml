name: Daily Operations Analysis

on:
  workflow_dispatch:
  schedule:
    # Rolling intraday analysis, Shanghai 06:15-22:15 every hour.
    - cron: '15 22-23,0-14 * * *'
    # Final daily run at Shanghai 23:00.
    - cron: '0 15 * * *'
  push:
    branches: [main]
    paths:
      # Fallback trigger: persisted SHMAAS samples wake the workflow.
      - 'data/shmaas/**'
      - '.github/workflows/daily-analysis.yml'
      - 'src/export_daily_operations.py'
      - 'src/postprocess_operations.py'
      - 'src/finalize_full_trip_arrivals.py'
      - 'src/reconcile_actual_departures.py'
      - 'src/estimate_individual_arrivals.py'
      - 'src/rank_daily_vehicle_speed.py'
      - 'src/export_highlighted_xlsx.py'
      - 'src/private_short_turn_classifier.py'
      - 'src/temporal_feasibility.py'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: daily-operations-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve analysis date and rolling gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          target_date="$(TZ=Asia/Shanghai date +%F)"
          echo "TARGET_DATE=${target_date}" >> "$GITHUB_ENV"
          echo "Analyzing Shanghai service date ${target_date} (event=${GITHUB_EVENT_NAME})"

          # Manual/scheduled runs and workflow/code changes always analyze.
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "run_analysis=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git show --pretty='' --name-only HEAD)"
          if echo "$changed" | grep -qv '^data/shmaas/'; then
            echo "Non-raw-data workflow/code push; running analysis."
            echo "run_analysis=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Raw-data fallback: sampler commits arrive roughly every 8-10 min.
          # Rebuild once per Shanghai clock hour, on the first raw-data commit
          # at minute 15 or later. This avoids unreliable filesystem mtimes.
          sh_minute="$(TZ=Asia/Shanghai date +%M)"
          if [ "$((10#$sh_minute))" -ge 15 ]; then
            marker="data/export/${target_date}-analysis-hour.txt"
            sh_hour="$(TZ=Asia/Shanghai date +%H)"
            previous=""
            if [ -f "$marker" ]; then previous="$(cat "$marker")"; fi
            if [ "$previous" != "$sh_hour" ]; then
              echo "run_analysis=true" >> "$GITHUB_OUTPUT"
              echo "ANALYSIS_HOUR=${sh_hour}" >> "$GITHUB_ENV"
              exit 0
            fi
          fi
          echo "run_analysis=false" >> "$GITHUB_OUTPUT"

      - name: Build daily exports with private pipeline
        if: steps.gate.outputs.run_analysis == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python src/export_daily_operations.py --date "$TARGET_DATE"
          python src/postprocess_operations.py --date "$TARGET_DATE"
          python src/finalize_full_trip_arrivals.py --date "$TARGET_DATE"
          python src/reconcile_actual_departures.py --date "$TARGET_DATE"
          python src/estimate_individual_arrivals.py --date "$TARGET_DATE"
          python src/rank_daily_vehicle_speed.py --date "$TARGET_DATE"
          python src/export_highlighted_xlsx.py --date "$TARGET_DATE"
          if [ -n "${ANALYSIS_HOUR:-}" ]; then
            printf '%s\n' "$ANALYSIS_HOUR" > "data/export/${TARGET_DATE}-analysis-hour.txt"
          fi

      - name: Commit daily exports
        if: steps.gate.outputs.run_analysis == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rm -rf /tmp/daily-export
          mkdir -p /tmp/daily-export
          cp -a data/export/. /tmp/daily-export/

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/export
            cp -a /tmp/daily-export/. data/export/
            git add data/export
            if git diff --cached --quiet; then
              echo 'Daily export already current.'
              exit 0
            fi
            git commit -m "data: publish ${TARGET_DATE} rolling operations analysis"
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'Failed to push daily export after retries.'
              exit 1
            fi
            sleep $((attempt * 2))
          done
