name: Daily Operations Analysis

on:
  workflow_dispatch:
  schedule:
    # Rolling intraday analysis, Shanghai 06:15-22:15 every hour.
    - cron: '15 22-23,0-14 * * *'
    # Final daily run at Shanghai 23:00.
    - cron: '0 15 * * *'
  push:
    branches: [main]
    paths:
      # Primary fallback trigger: every persisted SHMAAS sample wakes this
      # workflow. The gate below limits rolling exports to about hourly.
      - 'data/shmaas/**'
      - '.github/workflows/daily-analysis.yml'
      - 'src/export_daily_operations.py'
      - 'src/postprocess_operations.py'
      - 'src/finalize_full_trip_arrivals.py'
      - 'src/reconcile_actual_departures.py'
      - 'src/estimate_individual_arrivals.py'
      - 'src/rank_daily_vehicle_speed.py'
      - 'src/export_highlighted_xlsx.py'
      - 'src/private_short_turn_classifier.py'
      - 'src/temporal_feasibility.py'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: daily-operations-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve analysis date and rolling gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          target_date="$(TZ=Asia/Shanghai date +%F)"
          echo "TARGET_DATE=${target_date}" >> "$GITHUB_ENV"
          echo "Analyzing Shanghai service date ${target_date} (event=${GITHUB_EVENT_NAME})"

          # Manual and scheduled runs always analyze. Pushes caused by raw
          # SHMAAS persistence act as a fallback wake-up, but only rebuild the
          # exports when the last published operations CSV is at least 45 min
          # older than the newest raw SHMAAS file. This avoids an analysis run
          # after every ~8-10 minute sampler commit while also recovering from
          # missed GitHub schedule events.
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "run_analysis=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          newest_raw_epoch=0
          while IFS= read -r -d '' f; do
            epoch=$(stat -c %Y "$f")
            if [ "$epoch" -gt "$newest_raw_epoch" ]; then
              newest_raw_epoch="$epoch"
            fi
          done < <(find data/shmaas -maxdepth 1 -type f -name "${target_date}-*.jsonl" -print0 2>/dev/null || true)

          export_file="data/export/${target_date}-operations.csv"
          if [ ! -f "$export_file" ]; then
            echo "No operations CSV yet; running analysis."
            echo "run_analysis=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          export_epoch=$(stat -c %Y "$export_file")
          age=$((newest_raw_epoch - export_epoch))
          echo "Newest raw minus export age: ${age}s"
          if [ "$newest_raw_epoch" -gt 0 ] && [ "$age" -ge 2700 ]; then
            echo "run_analysis=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_analysis=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build daily exports with private pipeline
        if: steps.gate.outputs.run_analysis == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python src/export_daily_operations.py --date "$TARGET_DATE"
          python src/postprocess_operations.py --date "$TARGET_DATE"
          python src/finalize_full_trip_arrivals.py --date "$TARGET_DATE"
          python src/reconcile_actual_departures.py --date "$TARGET_DATE"
          python src/estimate_individual_arrivals.py --date "$TARGET_DATE"
          python src/rank_daily_vehicle_speed.py --date "$TARGET_DATE"
          # XLSX must be generated last so it always reflects the final CSV.
          python src/export_highlighted_xlsx.py --date "$TARGET_DATE"

      - name: Commit daily exports
        if: steps.gate.outputs.run_analysis == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rm -rf /tmp/daily-export
          mkdir -p /tmp/daily-export
          cp -a data/export/. /tmp/daily-export/

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/export
            cp -a /tmp/daily-export/. data/export/
            git add data/export
            if git diff --cached --quiet; then
              echo 'Daily export already current.'
              exit 0
            fi
            git commit -m "data: publish ${TARGET_DATE} rolling operations analysis"
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'Failed to push daily export after retries.'
              exit 1
            fi
            sleep $((attempt * 2))
          done
