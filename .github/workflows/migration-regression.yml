name: Migration Regression (safe)

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/private_short_turn_classifier.py'
      - 'src/temporal_feasibility.py'
      - 'src/extract_physical_trajectory.py'
      - 'src/regression_short_turn.py'
      - 'tests/**'
      - '.github/workflows/migration-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested ref only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile migration modules
        run: |
          python -m py_compile \
            src/private_short_turn_classifier.py \
            src/temporal_feasibility.py \
            src/extract_physical_trajectory.py \
            src/regression_short_turn.py

      - name: Run unit regressions
        run: |
          python -m pytest -q tests/test_private_short_turn_classifier.py tests/test_temporal_feasibility.py

      - name: Run real-data trajectory regressions
        run: |
          python src/regression_short_turn.py --case all | tee migration-regression.log

      - name: Upload regression log
        uses: actions/upload-artifact@v4
        with:
          name: migration-regression-log
          path: migration-regression.log
          if-no-files-found: error
          retention-days: 7
