name: Migration Regression (safe)

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/private_short_turn_classifier.py'
      - 'src/temporal_feasibility.py'
      - 'src/extract_physical_trajectory.py'
      - 'src/regression_short_turn.py'
      - 'src/export_daily_operations.py'
      - 'tests/**'
      - '.github/workflows/migration-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested ref only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile migration modules
        run: |
          python -m py_compile \
            src/private_short_turn_classifier.py \
            src/temporal_feasibility.py \
            src/extract_physical_trajectory.py \
            src/regression_short_turn.py \
            src/export_daily_operations.py

      - name: Run unit regressions
        run: python -m pytest -q tests/test_private_short_turn_classifier.py tests/test_temporal_feasibility.py

      - name: Run real-data trajectory regressions
        run: python src/regression_short_turn.py --case all | tee migration-regression.log

      - name: Run private daily exporter on 2026-09-15
        run: |
          rm -rf /tmp/migration-export
          mkdir -p /tmp/migration-export
          python src/export_daily_operations.py --date 2026-09-15 | tee exporter-regression.log
          test -s data/export/2026-09-15-operations.csv
          python - <<'PY'
          import csv, pathlib, sys
          p=pathlib.Path('data/export/2026-09-15-operations.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8-sig')))
          routes=sorted(set(r['线路'] for r in rows))
          print('routes=', routes, 'rows=', len(rows))
          required={'浦东35路','浦东78路','182路'}
          if not required.issubset(routes):
              raise SystemExit(f'missing routes: {required-set(routes)}')
          targets=[r for r in rows if r['线路']=='浦东35路' and r['车牌号']=='沪A11062A' and r['发车时间'] in {'06:36','09:24'}]
          print('11062=', [(r['发车时间'],r['班次类型'],r['班次类型判定依据']) for r in targets])
          by={r['发车时间']:r for r in targets}
          for dep in ('06:36','09:24'):
              if dep not in by or by[dep]['班次类型']!='疑似区间车':
                  raise SystemExit(f'11062 {dep} regression failed')
          PY
          cp data/export/2026-09-15-operations.csv /tmp/migration-export/
          cp data/export/2026-09-15-operations-meta.json /tmp/migration-export/
          for f in data/export/2026-09-15-浦东35路.csv data/export/2026-09-15-浦东78路.csv data/export/2026-09-15-182路.csv; do test -s "$f" && cp "$f" /tmp/migration-export/; done

      - name: Upload regression outputs
        uses: actions/upload-artifact@v4
        with:
          name: migration-regression-output
          path: |
            migration-regression.log
            exporter-regression.log
            /tmp/migration-export/*
          if-no-files-found: error
          retention-days: 7
