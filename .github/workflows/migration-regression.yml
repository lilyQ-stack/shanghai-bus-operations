name: Migration Regression (safe)

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/migration-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested ref only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest openpyxl
      - name: Compile migration modules
        run: python -m py_compile src/private_short_turn_classifier.py src/temporal_feasibility.py src/extract_physical_trajectory.py src/regression_short_turn.py src/export_daily_operations.py src/postprocess_operations.py src/finalize_full_trip_arrivals.py src/reconcile_actual_departures.py src/estimate_individual_arrivals.py src/rank_daily_vehicle_speed.py src/export_highlighted_xlsx.py
      - name: Run unit regressions
        run: python -m pytest -q tests/test_private_short_turn_classifier.py tests/test_temporal_feasibility.py
      - name: Run real-data trajectory regressions
        run: python src/regression_short_turn.py --case all | tee migration-regression.log
      - name: Run full private pipeline on 2026-09-15
        run: |
          rm -rf /tmp/migration-export && mkdir -p /tmp/migration-export
          python src/export_daily_operations.py --date 2026-09-15 | tee pipeline-regression.log
          python src/postprocess_operations.py --date 2026-09-15 | tee -a pipeline-regression.log
          python src/finalize_full_trip_arrivals.py --date 2026-09-15 | tee -a pipeline-regression.log
          python src/reconcile_actual_departures.py --date 2026-09-15 | tee -a pipeline-regression.log
          python src/estimate_individual_arrivals.py --date 2026-09-15 | tee -a pipeline-regression.log
          python src/rank_daily_vehicle_speed.py --date 2026-09-15 | tee -a pipeline-regression.log
          python src/export_highlighted_xlsx.py --date 2026-09-15 | tee -a pipeline-regression.log
          python - <<'PY'
          import csv,collections,os
          rows=list(csv.DictReader(open('data/export/2026-09-15-operations.csv',encoding='utf-8-sig')))
          required={'浦东35路','浦东78路','182路'}; ranked=collections.defaultdict(set); observed=collections.defaultdict(set)
          for r in rows:
              observed[r['线路']].add(r['车牌号'])
              if r.get('当日车速排名','').split('/')[0] not in {'','—'}:ranked[r['线路']].add(r['车牌号'])
          targets={(r.get('计划发车时间') or r['发车时间'],r['班次类型']) for r in rows if r['线路']=='浦东35路' and r['车牌号']=='沪A11062A' and (r.get('计划发车时间') or r['发车时间']) in {'06:36','09:24'}}
          if ('06:36','疑似区间车') not in targets or ('09:24','疑似区间车') not in targets:raise SystemExit('11062 classification drift')
          for route in required:
              if not ranked[route]:raise SystemExit(f'no ranked vehicles for {route}')
          for x in ['data/export/2026-09-15-operations.xlsx','data/export/2026-09-15-浦东35路.xlsx','data/export/2026-09-15-浦东78路.xlsx','data/export/2026-09-15-182路.xlsx']:
              if not os.path.exists(x):raise SystemExit(f'missing final XLSX: {x}')
          print('RANKED_VEHICLES=',{r:f'{len(ranked[r])}/{len(observed[r])}' for r in sorted(required)})
          PY
          cp data/export/2026-09-15-* /tmp/migration-export/ || true
      - name: Run full 2026-09-11 Pudong78 false-positive regression
        run: |
          python src/export_daily_operations.py --date 2026-09-11 | tee historical-2026-09-11.log
          python src/postprocess_operations.py --date 2026-09-11 | tee -a historical-2026-09-11.log
          python src/finalize_full_trip_arrivals.py --date 2026-09-11 | tee -a historical-2026-09-11.log
          python src/reconcile_actual_departures.py --date 2026-09-11 | tee -a historical-2026-09-11.log
          python src/estimate_individual_arrivals.py --date 2026-09-11 | tee -a historical-2026-09-11.log
          python src/rank_daily_vehicle_speed.py --date 2026-09-11 | tee -a historical-2026-09-11.log
          python - <<'PY'
          import csv
          rows=list(csv.DictReader(open('data/export/2026-09-11-operations.csv',encoding='utf-8-sig')))
          expected={('沪A35172D','18:25'),('沪A36809D','19:05'),('沪A55207D','19:58'),('沪A56123D','17:25'),('沪A57022D','19:30'),('沪A57902D','17:10'),('沪A59117D','17:55')}
          found={}
          for r in rows:
              if r.get('线路')!='浦东78路':continue
              key=(r.get('车牌号'),r.get('计划发车时间') or r.get('发车时间'))
              if key in expected:found[key]=r.get('班次类型')
          missing=expected-set(found); wrong={k:v for k,v in found.items() if v!='全程车'}
          print('PUDONG78_2026-09-11_GROUND_TRUTH=',found)
          if missing:raise SystemExit(f'missing known full trips: {sorted(missing)}')
          if wrong:raise SystemExit(f'known full trips misclassified: {wrong}')
          suspected=[(r.get('车牌号'),r.get('计划发车时间') or r.get('发车时间'),r.get('区间判定依据')) for r in rows if r.get('线路')=='浦东78路' and r.get('班次类型')=='疑似区间车']
          print('ALL_PUDONG78_SUSPECTED_SHORT_TURNS=',suspected)
          PY
          cp data/export/2026-09-11-operations.csv /tmp/migration-export/
          cp data/export/2026-09-11-operations-meta.json /tmp/migration-export/
          cp historical-2026-09-11.log /tmp/migration-export/
      - name: Upload regression outputs
        uses: actions/upload-artifact@v4
        with:
          name: migration-regression-output
          path: |
            migration-regression.log
            pipeline-regression.log
            /tmp/migration-export/*
          if-no-files-found: error
          retention-days: 7
