name: Migration Regression (safe)

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/private_short_turn_classifier.py'
      - 'src/temporal_feasibility.py'
      - 'src/extract_physical_trajectory.py'
      - 'src/regression_short_turn.py'
      - 'src/export_daily_operations.py'
      - 'src/postprocess_operations.py'
      - 'src/finalize_full_trip_arrivals.py'
      - 'src/reconcile_actual_departures.py'
      - 'src/estimate_individual_arrivals.py'
      - 'src/rank_daily_vehicle_speed.py'
      - 'tests/**'
      - '.github/workflows/migration-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested ref only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile migration modules
        run: python -m py_compile src/private_short_turn_classifier.py src/temporal_feasibility.py src/extract_physical_trajectory.py src/regression_short_turn.py src/export_daily_operations.py src/postprocess_operations.py src/finalize_full_trip_arrivals.py src/reconcile_actual_departures.py src/estimate_individual_arrivals.py src/rank_daily_vehicle_speed.py
      - name: Run unit regressions
        run: python -m pytest -q tests/test_private_short_turn_classifier.py tests/test_temporal_feasibility.py
      - name: Run real-data trajectory regressions
        run: python src/regression_short_turn.py --case all | tee migration-regression.log
      - name: Run private analysis pipeline on 2026-09-15
        run: |
          rm -rf /tmp/migration-export && mkdir -p /tmp/migration-export
          python src/export_daily_operations.py --date 2026-09-15 | tee pipeline-regression.log
          python src/postprocess_operations.py --date 2026-09-15 | tee -a pipeline-regression.log
          python src/finalize_full_trip_arrivals.py --date 2026-09-15 | tee -a pipeline-regression.log
          python src/reconcile_actual_departures.py --date 2026-09-15 | tee -a pipeline-regression.log
          python src/estimate_individual_arrivals.py --date 2026-09-15 | tee -a pipeline-regression.log
          python src/rank_daily_vehicle_speed.py --date 2026-09-15 | tee -a pipeline-regression.log
          python - <<'PY'
          import csv,json,collections
          p='data/export/2026-09-15-operations.csv';rows=list(csv.DictReader(open(p,encoding='utf-8-sig')));meta=json.load(open('data/export/2026-09-15-operations-meta.json',encoding='utf-8'))
          required={'浦东35路','浦东78路','182路'}
          if not required.issubset(set(r['线路'] for r in rows)):raise SystemExit('missing route')
          targets={(r.get('计划发车时间') or r['发车时间'],r['班次类型']) for r in rows if r['线路']=='浦东35路' and r['车牌号']=='沪A11062A' and (r.get('计划发车时间') or r['发车时间']) in {'06:36','09:24'}}
          if ('06:36','疑似区间车') not in targets or ('09:24','疑似区间车') not in targets:raise SystemExit('11062 classification drift')
          pending=sum(r['到达时间'] in ('','待确认') for r in rows);rankable=sum(r.get('参与车速排名')=='是' for r in rows);grades={g:sum(r.get('到达置信度')==g for r in rows) for g in 'ABCD'}
          ranked=collections.defaultdict(set);observed=collections.defaultdict(set)
          for r in rows:
              observed[r['线路']].add(r['车牌号'])
              if r.get('当日车速排名','').split('/')[0] not in {'','—'}:ranked[r['线路']].add(r['车牌号'])
          print('FINAL rows=',len(rows),'pending=',pending,'rankable_trips=',rankable,'grades=',grades)
          print('RANKED_VEHICLES=',{route:f'{len(ranked[route])}/{len(observed[route])}' for route in sorted(required)})
          print('RANK_META=',meta.get('daily_vehicle_ranked_counts'))
          for route in required:
              if not ranked[route]:raise SystemExit(f'no ranked vehicles for {route}')
          PY
          cp data/export/2026-09-15-operations.csv /tmp/migration-export/
          cp data/export/2026-09-15-operations-meta.json /tmp/migration-export/
          for f in data/export/2026-09-15-浦东35路.csv data/export/2026-09-15-浦东78路.csv data/export/2026-09-15-182路.csv; do test -s "$f" && cp "$f" /tmp/migration-export/; done
      - name: Upload regression outputs
        uses: actions/upload-artifact@v4
        with:
          name: migration-regression-output
          path: |
            migration-regression.log
            pipeline-regression.log
            /tmp/migration-export/*
          if-no-files-found: error
          retention-days: 7
