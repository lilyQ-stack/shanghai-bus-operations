name: Audit Sep 29 short-turn speed evidence
on:
  push:
    paths:
      - '.github/workflows/audit-short-turn-20260929.yml'
      - 'src/audit_short_turn_20260929.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python src/audit_short_turn_20260929.py
      - name: Persist evidence audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'data/export/2026-09-29-浦东35路-short-turn-audit.json' 'data/export/2026-09-29-浦东35路-combined-ranking.json'
          if ! git diff --cached --quiet; then
            git commit -m 'data: Sep 29 short-turn ranking evidence audit'
            git push
          fi
