name: Rolling Short-Turn Analysis

on:
  workflow_dispatch:
  schedule:
    # Reliable independent fallback: refresh every 10 minutes during Shanghai 05:00-23:59.
    # Data commits made with GITHUB_TOKEN do not reliably trigger another push workflow,
    # so rolling analysis must not depend on sampler-generated push events.
    - cron: '*/10 21-23,0-15 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rolling-analysis.yml'
      - 'src/analyze_rolling.py'
      - 'src/analyze_daily_safe.py'
      - 'src/analyze_daily.py'
      - 'src/analyze_daily_rule_v4.py'
      - 'data/shmaas/**'

permissions:
  contents: write

concurrency:
  group: shmaas-rolling-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependency
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Analyze latest complete repository state and publish rolling result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          date_cst="$(TZ=Asia/Shanghai date +%F)"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            python src/analyze_rolling.py --date "$date_cst"
            git add data/rolling

            if git diff --cached --quiet; then
              echo 'Rolling result already current.'
              break
            fi

            git commit -m "data: update rolling short-turn analysis ${date_cst}"
            if git push origin HEAD:main; then
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo 'Failed to publish rolling analysis after retries.'
              exit 1
            fi
            sleep $((attempt * 2))
          done
