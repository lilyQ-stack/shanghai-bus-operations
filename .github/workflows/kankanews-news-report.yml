name: Kankanews News Report Collector

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Program date (YYYY-MM-DD); leave blank for yesterday in Asia/Shanghai'
        required: false
        type: string
  schedule:
    - cron: '50 0 * * *'
  push:
    paths:
      - 'news-report/fetch_kankanews.py'
      - 'news-report/requirements.txt'
      - '.github/workflows/kankanews-news-report.yml'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r news-report/requirements.txt
      - name: Collect program page
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            python news-report/fetch_kankanews.py --date "$INPUT_DATE"
          else
            python news-report/fetch_kankanews.py
          fi
      - name: Commit collected data
        run: |
          if [ -z "$(git status --porcelain -- news-report/data)" ]; then
            echo "No data changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-report/data
          git commit -m "Update Kankanews News Report data"
          git push
