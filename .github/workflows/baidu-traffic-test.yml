name: Baidu Traffic Manual Smoke Test
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Query two roads (no key logging)
        env:
          BAIDU_MAP_AK: ${{ secrets.BAIDU_MAP_AK }}
        run: python3 commute-monitor/test_baidu_traffic.py
