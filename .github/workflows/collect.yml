name: SHMAAS Combined Sampler

on:
  workflow_dispatch:
    inputs: {}
  schedule:
    # Fallback only: cron-job.org is the primary 10-minute trigger.
    # Shanghai 05:35-22:35, hourly at :35, deliberately offset from the external trigger.
    - cron: '35 21-23,0-13 * * *'
    - cron: '35 14 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect.yml'
      - 'src/shmaas_key_stop_sampler.py'
      - 'src/shmaas_key_stop_sampler_safe.py'

permissions:
  contents: write

concurrency:
  group: shmaas-combined-sampler
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sample all routes sequentially
        id: sample
        shell: bash
        run: |
          set +e
          failed=0
          for route in '浦东78路' '浦东35路' '182路'; do
            echo "=== Sampling ${route} ==="
            python src/shmaas_key_stop_sampler_safe.py --route "$route"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "Sampler failed for ${route} with rc=${rc}"
              failed=1
            fi
          done
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve samples in one commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          date_cst="$(TZ=Asia/Shanghai date +%F)"

          rm -rf /tmp/shmaas-new
          mkdir -p /tmp/shmaas-new
          found=0
          for route in '浦东78路' '浦东35路' '182路'; do
            file="data/shmaas/${date_cst}-${route}.jsonl"
            latest="data/shmaas/latest-${route}.json"
            if [ -f "$file" ]; then
              tail -n 1 "$file" > "/tmp/shmaas-new/${route}.jsonl"
              if [ ! -s "/tmp/shmaas-new/${route}.jsonl" ]; then
                echo "Empty saved sample for ${route}; refusing to persist a silent data loss."
                exit 1
              fi
              python - "$route" "/tmp/shmaas-new/${route}.jsonl" <<'PY'
          import json, sys
          route, path = sys.argv[1], sys.argv[2]
          with open(path, encoding='utf-8') as f:
              rec = json.loads(f.read())
          if rec.get('route') != route or not rec.get('sample_time_cst'):
              raise SystemExit(f'invalid saved sample for {route}')
          PY
              found=1
            fi
            if [ -f "$latest" ]; then
              cp "$latest" "/tmp/shmaas-new/latest-${route}.json"
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo 'No route produced a sample.'
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/shmaas

            for route in '浦东78路' '浦东35路' '182路'; do
              saved="/tmp/shmaas-new/${route}.jsonl"
              target="data/shmaas/${date_cst}-${route}.jsonl"
              if [ -f "$saved" ]; then
                touch "$target"
                record="$(cat "$saved")"
                grep -Fqx -- "$record" "$target" || printf '%s\n' "$record" >> "$target"
                if ! grep -Fqx -- "$record" "$target"; then
                  echo "Persistence verification failed for ${route}."
                  exit 1
                fi
              fi
              latest_saved="/tmp/shmaas-new/latest-${route}.json"
              if [ -f "$latest_saved" ]; then
                cp "$latest_saved" "data/shmaas/latest-${route}.json"
              fi
            done

            # Maintain a compact, query-friendly roster of every vehicle observed today.
            # This is derived from the complete daily JSONL after rebasing, so it also
            # backfills vehicles seen before this feature was introduced.
            python - "$date_cst" <<'PY'
          import csv, json, sys
          from pathlib import Path

          date = sys.argv[1]
          root = Path('data/shmaas')
          for route in ('浦东78路', '浦东35路', '182路'):
              source = root / f'{date}-{route}.jsonl'
              if not source.exists():
                  continue
              seen = {}
              with source.open(encoding='utf-8') as f:
                  for line in f:
                      try:
                          rec = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      sample_time = rec.get('sample_time_cst') or ''
                      for vehicle in rec.get('vehicles') or []:
                          plate = vehicle.get('plate')
                          if not plate:
                              continue
                          item = seen.setdefault(plate, {'first_seen': sample_time, 'last_seen': sample_time, 'movement_seen': False, 'dispatch_seen': False})
                          if sample_time and (not item['first_seen'] or sample_time < item['first_seen']): item['first_seen'] = sample_time
                          if sample_time and sample_time > item['last_seen']: item['last_seen'] = sample_time
                          roles = set(vehicle.get('roles') or [])
                          item['movement_seen'] = item['movement_seen'] or bool(roles & {'current', 'next'})
                          item['dispatch_seen'] = item['dispatch_seen'] or ('dispatch' in roles)
              out = root / f'{date}-{route}-vehicles.csv'
              with out.open('w', encoding='utf-8-sig', newline='') as f:
                  w = csv.writer(f)
                  w.writerow(['线路','车牌号','首次观测','最后观测','已上线运行','出现待发'])
                  for plate in sorted(seen):
                      x = seen[plate]
                      w.writerow([route, plate, x['first_seen'], x['last_seen'], '是' if x['movement_seen'] else '否', '是' if x['dispatch_seen'] else '否'])
              print(f'roster {route}: {len(seen)} vehicles -> {out}')
          PY

            git add data/shmaas
            if git diff --cached --quiet; then
              echo 'Samples already present.'
              break
            fi
            git commit -m 'data: persist combined SHMAAS sample'
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'Failed to push samples after retries.'
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Fail if any route sampler failed
        if: steps.sample.outputs.failed == '1'
        run: |
          echo 'At least one route returned sampling errors; successful samples were preserved.'
          exit 1
