name: Pudong35 Stop Reference Unit Tests
on:
  pull_request:
    paths:
      - 'src/postprocess_operations.py'
      - 'src/export_pudong35_full_stop_reference.py'
      - 'data/reference/pudong35-stop-map-verified-partial.json'
      - 'tests/test_pudong35_verified_stop_map.py'
      - '.github/workflows/pudong35-stop-reference-tests.yml'
  workflow_dispatch:
jobs:
  isolated-mapping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile modified scripts
        run: python -m py_compile src/postprocess_operations.py src/export_pudong35_full_stop_reference.py
      - name: Test mapping independently of existing classifier failures
        run: python -m pytest -q tests/test_pudong35_verified_stop_map.py
