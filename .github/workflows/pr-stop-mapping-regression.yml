name: PR Stop Mapping Regression
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/postprocess_operations.py'
      - '.github/workflows/pr-stop-mapping-regression.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest openpyxl
      - name: Classifier unit tests
        run: python -m pytest -q tests/test_private_short_turn_classifier.py tests/test_temporal_feasibility.py
      - name: Historical short-turn regression
        run: python src/regression_short_turn.py
      - name: Rebuild 2026-09-16
        run: |
          python src/export_daily_operations.py --date 2026-09-16
          python src/postprocess_operations.py --date 2026-09-16
          python src/finalize_full_trip_arrivals.py --date 2026-09-16
          python src/reconcile_actual_departures.py --date 2026-09-16
          python src/estimate_individual_arrivals.py --date 2026-09-16
      - name: Assert Pudong35 positives and physical stop labels
        run: |
          python - <<'PY'
          import csv
          p='data/export/2026-09-16-浦东35路.csv'
          rows=list(csv.DictReader(open(p,encoding='utf-8-sig')))
          for plate,dep in [('沪A17590A','06:36'),('沪A62981D','07:24')]:
              r=next(x for x in rows if x['车牌号']==plate and x['发车时间']==dep)
              assert r['班次类型']=='疑似区间车',r
              assert r['区间站']!='迎春路长柳路' or plate!='沪A17590A',r
              print(plate,dep,r['区间站'],r['区间站到达时间'],r['区间站折返发车时间'])
          PY
      - name: Rebuild historical Pudong78 regression day
        run: |
          python src/export_daily_operations.py --date 2026-09-11
          python src/postprocess_operations.py --date 2026-09-11
          python - <<'PY'
          import csv
          bad={'沪A35172D','沪A36809D','沪A55207D','沪A56123D','沪A57022D','沪A57902D','沪A59117D'}
          rows=list(csv.DictReader(open('data/export/2026-09-11-浦东78路.csv',encoding='utf-8-sig')))
          flagged=[r for r in rows if r['车牌号'] in bad and r['班次类型']=='疑似区间车']
          assert not flagged,flagged
          print('historical false-positive regression OK')
          PY